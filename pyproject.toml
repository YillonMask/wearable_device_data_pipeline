[project]
name = "wearable-pipeline"
version = "0.1.0"
description = "Personal multi-wearable health data pipeline (Oura, Whoop, Fitbit Air)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]
analysis = [
    "pandas>=2.2",
    "scipy>=1.13",
]
viz = [
    "streamlit>=1.30",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.scripts]
wearable = "wearable_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wearable_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
